        - "RTO notice: your vehicle has a pending challan. Install the Parivahan app from {apk_url} to avoid court action."
      hi:
        - "आपके वाहन पर Rs {amount} का ई-चालान जारी हुआ है। देखने और भरने के लिए ऐप डाउनलोड करें: {apk_url}"
        - "RTO सूचना: आपके वाहन का चालान बाकी है। कोर्ट कार्रवाई से बचने के लिए {apk_url} से परिवहन ऐप इंस्टॉल करें।"
      hinglish:
        - "Aapki gaadi par Rs {amount} ka e-challan issue hua hai. Dekhne aur bharne ke liye app download karein: {apk_url}"
