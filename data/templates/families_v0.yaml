      hi:
        - "यह साइबर क्राइम ब्रांच है। आपके नाम से अवैध सामान वाला पार्सल मिला है। तुरंत {phone} पर कॉल करें वरना आपको गिरफ्तार किया जाएगा।"
        - "CBI नोटिस: आपका आधार मनी लॉन्ड्रिंग केस से जुड़ा है। यह कॉल न काटें। गिरफ्तारी से बचने के लिए {phone} पर संपर्क करें।"
      hinglish:
        - "Yeh cyber crime branch hai. Aapke naam se illegal saamaan wala parcel mila hai. Turant {phone} par call karein warna aapko arrest kiya jayega."
        - "CBI notice: aapka Aadhaar money laundering case se juda hai. Yeh call na kaatein. Arrest se bachne ke liye {phone} par contact karein."

  - family_id: scam_loan_app_001
