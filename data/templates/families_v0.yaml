      hinglish:
        - "5 minute me Rs {amount} tak ka instant loan. Koi document nahi chahiye. Abhi app install karein: {apk_url}"

  - family_id: scam_investment_001
    label: scam
    codes: [INVESTMENT_CRYPTO, LOOKALIKE_DOMAIN]
    variants:
