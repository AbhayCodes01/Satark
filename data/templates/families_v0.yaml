# Satark template families, v0 (STARTER SET)
#
# STATUS: DRAFT. Written by Claude. English, Hindi (Devanagari) and Hinglish (romanized) wording
# must be reviewed by the project owner before it counts as "verified".
#
# A "family" is ONE scenario expressed in every language. The train/val/test split is done
# per family, so a scenario and its translations never end up on both sides of the split.
#
# Fields:
#   family_id : unique, stable id
#   label     : scam | ham
#   codes     : reason codes from data/taxonomy.yaml (empty list for ham)
#   variants  : language -> list of message templates
#
# Slots (filled randomly by ml/generate_data.py):
#   {bank} {amount} {fee} {phone} {name} {upi} {date} {otp} {last4} {shop}
#   {pnr} {train} {url} {apk_url} {shop_url} {bill_url}
# {url} / {apk_url} become suspicious-looking links (lookalike, shortener, IP, .apk).
# {shop_url} is the real site matching {shop}; {bill_url} is a real electricity portal (legit messages only).
# Optional per-family field: slot_overrides: {apk_names: [...]} for realistic file names.
#
# Scam rows below are for TRAINING A DETECTOR. Phone numbers, UPI ids and links are generated.

families:
  # ------------------------------------------------------------------ SCAMS
  - family_id: scam_kyc_bank_001
    label: scam
    codes: [KYC_BANK_BLOCK, URGENCY, LOOKALIKE_DOMAIN]
    variants:
      en:
        - "Dear customer, your {bank} account will be blocked today. Update your KYC immediately: {url}"
        - "{bank} ALERT: KYC pending. Your account will be suspended within 24 hours. Click {url} to verify now."
      hi:
        - "प्रिय ग्राहक, आपका {bank} खाता आज बंद कर दिया जाएगा। तुरंत KYC अपडेट करें: {url}"
        - "{bank} सूचना: आपका KYC अधूरा है। 24 घंटे में खाता बंद हो जाएगा। अभी वेरिफाई करें: {url}"
      hinglish:
        - "Dear customer, aapka {bank} account aaj block ho jayega. Turant KYC update karein: {url}"
        - "{bank} alert: KYC pending hai. 24 ghante me account band ho jayega. Abhi verify karein {url}"

  - family_id: scam_otp_001
    label: scam
    codes: [OTP_REQUEST, URGENCY]
    variants:
      en:
        - "Your {bank} refund of Rs {amount} is pending. Reply with the OTP sent to your phone to receive it."
        - "Sir, this is {bank} support. Please share the 6 digit OTP you just received to cancel the wrong transaction of Rs {amount}."
      hi:
        - "आपका {bank} रिफंड Rs {amount} बाकी है। पाने के लिए फोन पर आया OTP बताएं।"
        - "सर, मैं {bank} सपोर्ट से बोल रहा हूँ। Rs {amount} का गलत ट्रांजैक्शन रद्द करने के लिए अभी आया 6 अंकों का OTP शेयर करें।"
      hinglish:
        - "Aapka {bank} refund Rs {amount} pending hai. Paane ke liye phone par aaya OTP reply karein."
        - "Sir, {bank} support se bol raha hu. Rs {amount} ka galat transaction cancel karne ke liye abhi aaya 6 digit OTP share karein."

  - family_id: scam_upi_collect_001
    label: scam
    codes: [UPI_COLLECT]
    variants:
      en:
        - "You have received Rs {amount} cashback. Open your UPI app and approve the request from {upi} to receive money."
        - "Congrats {name}! Rs {amount} is waiting for you. Accept the collect request from {upi} and enter your UPI PIN to get it."
      hi:
        - "आपको Rs {amount} कैशबैक मिला है। पैसे पाने के लिए UPI ऐप खोलकर {upi} का रिक्वेस्ट अप्रूव करें।"
        - "बधाई {name}! Rs {amount} आपका इंतज़ार कर रहे हैं। {upi} की कलेक्ट रिक्वेस्ट स्वीकार करें और UPI PIN डालें।"
      hinglish:
        - "Aapko Rs {amount} cashback mila hai. Paise lene ke liye UPI app khol kar {upi} ki request approve karein."
        - "Badhai ho {name}! Rs {amount} aapka wait kar rahe hain. {upi} ki collect request accept karein aur UPI PIN dalein."

  - family_id: scam_electricity_001
    label: scam
    codes: [ELECTRICITY_DISCONNECT, URGENCY]
    variants:
      en:
        - "Dear consumer, your electricity connection will be disconnected tonight at 9:30 PM due to unpaid bill. Call {phone} immediately."
        - "Electricity bill of Rs {amount} not updated. Power will be cut today. Contact officer on {phone} now."
      hi:
        - "प्रिय उपभोक्ता, बिल जमा न होने के कारण आज रात 9:30 बजे आपका बिजली कनेक्शन काट दिया जाएगा। तुरंत {phone} पर कॉल करें।"
        - "आपका Rs {amount} का बिजली बिल अपडेट नहीं हुआ है। आज बिजली कट जाएगी। अभी {phone} पर अधिकारी से संपर्क करें।"
      hinglish:
        - "Dear consumer, bill jama na hone ke karan aaj raat 9:30 baje aapka bijli connection kat diya jayega. Turant {phone} par call karein."
        - "Aapka Rs {amount} ka bijli bill update nahi hua hai. Aaj light kat jayegi. Abhi {phone} par officer se baat karein."

  - family_id: scam_courier_001
    label: scam
    codes: [COURIER_CUSTOMS, LOOKALIKE_DOMAIN]
    variants:
      en:
        - "Your parcel is held at customs. Pay a clearance fee of Rs {amount} at {url} to get it delivered."
        - "India Post: delivery failed due to incomplete address. Update address and pay Rs {amount} here: {url}"
      hi:
        - "आपका पार्सल कस्टम में रोका गया है। डिलीवरी के लिए Rs {amount} क्लियरेंस फीस यहाँ जमा करें: {url}"
        - "इंडिया पोस्ट: अधूरे पते के कारण डिलीवरी नहीं हो सकी। पता अपडेट करें और Rs {amount} यहाँ भरें: {url}"
      hinglish:
        - "Aapka parcel customs me ruka hai. Delivery ke liye Rs {amount} clearance fee yahan bharein: {url}"
        - "India Post: adhoore address ki wajah se delivery fail ho gayi. Address update karein aur Rs {amount} yahan bharein: {url}"

  - family_id: scam_challan_001
    label: scam
    codes: [FAKE_CHALLAN, MALICIOUS_APK]
